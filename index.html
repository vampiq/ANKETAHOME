<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Анкета Дизайн Дома</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #dcd3c6; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; font-family: 'Cormorant Garamond', serif; color: #1a1a1a; }
.controls { margin-bottom: 25px; display: flex; gap: 15px; justify-content: center; width: 100%; max-width: 210mm; }
button.btn-main { padding: 14px 28px; font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; letter-spacing: 1px; cursor: pointer; border: 1px solid #1a1a1a; background: #1a1a1a; color: #f4efe9; transition: .3s; text-transform: uppercase; }
button.btn-main:hover { background: #333; }
.btn-settings { padding: 10px; border-radius: 50%; position: fixed; bottom: 20px; right: 20px; z-index: 100; background: #f4efe9; box-shadow: 0 4px 10px rgba(0,0,0,.1); border: 1px solid #1a1a1a; cursor: pointer; }
.btn-settings svg { width: 24px; height: 24px; }

/* Модалки и Админка */
#password-modal, #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
.password-box { background: #f4efe9; padding: 30px; border-radius: 8px; max-width: 400px; width: 100%; text-align: center; font-family: sans-serif; }
.password-box input { width: 100%; padding: 10px; margin: 15px 0; font-size: 18px; text-align: center; border: 1px solid #1a1a1a; background: transparent; font-family: monospace; }
.password-box button { padding: 10px 20px; font-family: sans-serif; font-size: 14px; cursor: pointer; }
.admin-content { background: #f4efe9; padding: 30px; border-radius: 8px; max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; font-family: sans-serif; color: #333; }
.admin-content h3 { margin-bottom: 15px; font-family: 'Playfair Display', serif; }
.admin-section { background: #fff; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; padding: 15px; }
.admin-section-header { font-size: 16px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 5px; }
.admin-q { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
.admin-q input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: sans-serif; }
.admin-q button { background: #ffcccc; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; color: #d9534f; font-weight: bold; }
.admin-add-btn { display: inline-block; margin-top: 10px; padding: 8px 15px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
.admin-actions { display: flex; gap: 10px; margin-top: 20px; border-top: 1px solid #ccc; padding-top: 20px; position: sticky; bottom: 0; background: #f4efe9; padding-bottom: 10px; }
.admin-actions button { padding: 12px 20px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }

/* Лист А4 */
.a4-page { background: #f4efe9; width: 210mm; padding: 20mm 18mm; box-shadow: 0 10px 30px rgba(0,0,0,.15); position: relative; }
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
.logo h1 { font-family: 'Playfair Display', serif; font-size: 42px; line-height: .85; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
.house-icon { width: 50px; height: 50px; }
.section { margin-bottom: 25px; }
.section-title { font-family: 'Playfair Display', serif; font-size: 16px; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid #1a1a1a; padding-bottom: 5px; display: inline-block; }
.sub-title { font-size: 14px; letter-spacing: 1px; margin: 15px 0 10px; text-transform: uppercase; font-weight: 600; }
.form-group { margin-bottom: 15px; page-break-inside: avoid; }
label { display: block; font-size: 12px; letter-spacing: .5px; margin-bottom: 5px; font-weight: 600; color: #333; }

.input-box { width: 100%; border-bottom: 1px solid #1a1a1a; background: transparent; font-family: 'Cormorant Garamond', serif; font-size: 18px; padding: 3px 0; outline: none; color: #000; min-height: 28px; line-height: 1.4; word-wrap: break-word; overflow-wrap: break-word; white-space: pre-wrap; }
.input-box:empty::before { content: attr(data-placeholder); color: #aaa; font-style: italic; font-size: 16px; pointer-events: none; }

.checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 5px; align-items: center; }
.custom-checkbox { display: flex; align-items: center; cursor: pointer; font-size: 17px; font-weight: 400; color: #000; }
.custom-checkbox input { display: none; }
.checkmark { width: 16px; height: 16px; border: 1px solid #1a1a1a; display: inline-block; margin-right: 8px; position: relative; background: transparent; flex-shrink: 0; }
.custom-checkbox input:checked + .checkmark::after { content: "✓"; position: absolute; top: -4px; left: 2px; font-size: 16px; color: #1a1a1a; }

.hidden-block { display: none; margin-left: 25px; margin-top: 10px; padding-left: 15px; border-left: 1px solid #1a1a1a; }
.hidden-block.active { display: block; }

.room-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; width: 100%; max-width: 400px; }
.room-row .input-box { width: 60px; text-align: center; border-bottom: 1px solid #ccc; }
.room-details { border: 1px solid #1a1a1a; padding: 15px; margin-top: 15px; background: rgba(255,255,255,0.3); page-break-inside: avoid; }
.room-details h4 { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
.footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 30px; padding-top: 15px; border-top: 1px solid #1a1a1a; }
.footer-left p { font-size: 10px; letter-spacing: 1px; color: #555; text-transform: uppercase; }
.footer-right h2 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; }

/* ФОТО */
.ref-grid { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
.ref-box { width: 31%; aspect-ratio: 4/3; border: 1px dashed #1a1a1a; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background: #fff; }
.ref-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
.ref-box span { font-size: 12px; color: #666; text-transform: uppercase; pointer-events: none; }
.ref-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.ref-box .delete-ref { position: absolute; top: 5px; right: 5px; background: rgba(255,255,255,0.8); border: 1px solid #d9534f; color: #d9534f; font-weight: bold; border-radius: 50%; width: 20px; height: 20px; display: none; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; z-index: 10; }

@media (max-width: 768px) { .a4-page { width: 100%; padding: 20px; } .logo h1 { font-size: 32px; } .house-icon { width: 40px; height: 40px; } .ref-box { width: 48%; } }

/* Печать */
@media print {
    body { background: #fff; padding: 0; display: block; }
    .no-print, .add-btn, .rm-btn, .btn-settings, .delete-ref { display: none !important; }
    .a4-page { box-shadow: none; width: 100%; padding: 15mm; margin: 0; background: #fff; }
    .section, .room-details { page-break-inside: avoid; margin-bottom: 20px; }
    .input-box { border-bottom: 1px dashed #999 !important; font-size: 16px; }
    .checkmark { border: 1.5px solid #000 !important; }
    .room-details { border: 1px solid #000 !important; }
    .ref-box { border: 1px solid #000 !important; }
    .ref-box span { display: none; }
    .ref-box img { display: block !important; }
}
</style>
</head>
<body>

<div class="controls no-print">
    <button onclick="downloadPDF()" class="btn-main">Скачать PDF</button>
</div>

<button class="btn-settings no-print" onclick="showPasswordModal()" title="Редактировать">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
</button>

<div id="password-modal">
    <div class="password-box">
        <h3>Вход в админ-панель</h3>
        <input type="password" id="admin-password" placeholder="Введите пароль...">
        <div>
            <button onclick="checkPassword()" style="background: #1a1a1a; color: white; border: none;">Войти</button>
            <button onclick="closePasswordModal()" style="background: #ccc; border: none; margin-left: 10px;">Отмена</button>
        </div>
    </div>
</div>

<div id="admin-panel">
    <div class="admin-content">
        <h3>Редактор анкеты</h3>
        <div id="admin-sections"></div>
        <div class="admin-actions">
            <button onclick="saveAdmin()" style="background: #1a1a1a; color: white;">Сохранить</button>
            <button onclick="exportHTML()" style="background: #2c6e49; color: white;">Скачать HTML</button>
            <button onclick="document.getElementById('admin-panel').style.display='none'" style="background: #ccc;">Закрыть</button>

<div class="a4-page" id="questionnaire">
    <header class="header">
        <div class="logo"><h1>HOME</h1><h1>DESIGN</h1><h1>FORM</h1></div>
        <svg class="house-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 50 L50 15 L90 50" stroke-width="4"/><path d="M20 45 L20 90 L80 90 L80 45"/><rect x="40" y="60" width="20" height="30"/></svg>
    </header>

    <div id="form-container"></div>

    <footer class="footer">
        <div class="footer-left"><p>АРХИТЕКТУРА И ИНТЕРЬЕР</p></div>

</div>

<script>
const defaultData = [

    { id: "p3", title: "ЧАСТЬ 3. СОСТАВ ПОМЕЩЕНИЙ", type: "rooms", desc: "Отметьте помещения, которые будут в вашем доме, и укажите их количество:" },

        { text: "Ассоциации (3 слова, описывающие идеальный дом):" },
        { text: "Атмосфера:" },
        { text: "Акцентный цвет:" },
        { text: "Цвета-табу (2-3):" },
        { text: "Материалы-табу:" },
        { text: "Стилистика: Гостиная" },
        { text: "Стилистика: Спальня" },
        { text: "Стилистика: Кабинет" }
    ]}
];

const roomsData = {
    hallway: { title: "ПРИХОЖАЯ", questions: [
        "Отделка: Пол (плитка/керамогранит/ламинат). Стены (покраска/обои/панели).",
        "Освещение: Люстра, точечные, подсветка зеркала, лента в нише.",
        "Сценарий: «Я захожу, держа сумку и ключи...»",
        "Хранение: Закрытый шкаф для одежды или открытая вешалка?",
        "Обувь: Обувница или гардеробная? Нужна ли сушка и розетка?",
        "Переобувание: Нужна ли скамья/пуф?",
        "Мелочи: Где будут лежать ключи, кошелек, зонты?",
        "Зеркало: Нужно ли в полный рост?"
    ]},
    kitchen: { title: "КУХНЯ", questions: [
        "Отделка: Пол, Стены/Фартук, Потолок.",
        "Освещение: Люстра, точечные, подсветка фартука, в шкафах, трековый.",
        "Сценарий: «Я захожу на кухню, первым делом... Грязную посуду ставлю...»",
        "Планировка: Линейная, Угловая, П-образная, С островом?",
        "Верхние шкафы: Оставляем или убираем?",
        "Техника: Духовка, Микроволновка, Посудомойка, Винный шкаф, Холодильник?",
        "Сушка для посуды: Нужна или не нужна?",
        "Потайной ящик (сейф): Нужен или нет?",
        "Противни и формы: Нужен ли специальный узкий пенал?",
        "Посуда и бокалы: Нужен сервант или прячем в шкафы?",
        "Крупная утварь: Где стоят мультиварка, блендер?"
    ]},
    living_room: { title: "ГОСТИНАЯ", questions: [
        "Отделка: Пол, Стены, Потолок.",
        "Освещение: Люстра, подвесные, точечные, торшер, подсветка полок.",

        "Нужен ли ТВ (какой размер) или проектор?",

    ]},
    bedroom: { title: "СПАЛЬНЯ (Мастер-спальня)", questions: [
        "Отделка: Пол, Стены, Потолок.",
        "Освещение: Люстра, бра, подвесные, точечные, подсветка изголовья.",
        "Кровать: Размер. Нужны ли тумбы с обеих сторон?",
        "Зона отдыха: Нужно ли кресло/кушетка?",
        "ТВ: Нужен ли телевизор в спальне?",
        "Макияж: Где вы предпочитаете краситься?",
        "Хранение одежды: Нужна гардеробная или шкаф в спальне?"
    ]},
    wardrobe: { title: "ГАРДЕРОБНАЯ", questions: [
        "Освещение: Общий свет, точечные, подсветка полок, зеркала.",
        "Одежда: Чего больше?",
        "Аксессуары: Нужны ли полки для сумок, галстуков?",
        "Зимние вещи: Где храните пуховики?",

    bathroom_master: { title: "САНУЗЕЛ", questions: [

        "Ванна или душ?",

        "Корзина для белья: Где будет стоять?",

    ]},
    cabinet: { title: "КАБИНЕТ", questions: [
        "Отделка: Пол, Стены, Потолок.",
        "Освещение: Люстра, лампа, бра/торшер, точечные, подсветка полок.",
        "Вид деятельности: Чем занимаетесь?",

    ]},
    kids_room: { title: "ДЕТСКАЯ", questions: [
        "Отделка: Пол, Стены, Потолок.",
        "Освещение: Люстра, лампа, бра/торшер, точечные, подсветка полок.",
        "Возраст, увлечения? Нужна ли зона для учебы?"
    ]},
    bathroom_guest: { title: "САНУЗЕЛ (Гостевой)", questions: ["Отделка", "Освещение", "Ванна или душ", "Хранение"] },
    laundry: { title: "ПОСТИРОЧНАЯ", questions: ["Отделка", "Освещение", "Оборудование", "Хранение химии"] }
};

let appData = JSON.parse(localStorage.getItem('qData')) || JSON.parse(JSON.stringify(defaultData));

// Универсальный генератор галочек с кастомным текстом уточнения
function checkGroup(name, options, detailText = null) {
    let html = `<div class="checkbox-group">`;
    options.forEach(opt => {
        html += `<label class="custom-checkbox"><input type="checkbox" ${detailText ? `onchange="toggleDetails(this)"` : ''}><span class="checkmark"></span> ${opt}</label>`;
    });
    html += `</div>`;
    if (detailText) {
        html += `<div class="hidden-block"><label>${detailText}</label><div class="input-box" contenteditable="true" data-placeholder="Введите текст..."></div></div>`;
    }
    return html;
}

function toggleDetails(checkbox) {
    const parent = checkbox.closest('.form-group');
    const details = parent.querySelector('.hidden-block');
    if (details) {
        const anyChecked = Array.from(parent.querySelectorAll('input[type="checkbox"]')).some(cb => cb.checked);
        details.classList.toggle('active', anyChecked);
    }
}

function renderForm() {
    const container = document.getElementById('form-container');
    let html = '';

    appData.forEach(section => {
        if (section.id === 'p2') {
            html += `<section class="section"><h2 class="section-title">${section.title}</h2>
            <div class="sub-title">Окна и Шторы:</div>
            <div class="form-group"><label>Окна в пол (панорамные):</label>${checkGroup('win1', ['Есть', 'Нет'], 'В каких комнатах?')}</div>
            <div class="form-group"><label>Функциональные пожелания к шторам (Блокировка света, тип):</label><div class="input-box" contenteditable="true" data-placeholder="Введите текст..."></div></div>
            <div class="form-group"><label>Где нужна полная блокировка света (Blackout)?</label><div class="input-box" contenteditable="true" data-placeholder="Например: в спальне, детской..."></div></div>
            <div class="form-group"><label>Нужны ли электроприводы (умные шторы)?</label>${checkGroup('win2', ['Да', 'Нет'], 'В каких комнатах?')}</div>
            <div class="form-group"><label>Нужны ли скрытые карнизы в потолке (ниши) для штор?</label>${checkGroup('win3', ['Да', 'Нет'])}</div>
            
            <div class="sub-title">Двери и Проемы:</div>
            <div class="form-group"><label>Стиль межкомнатных дверей:</label>${checkGroup('door1', ['Скрытые', 'Классические', 'Минимализм', 'Затрудняюсь'])}</div>
            <div class="form-group"><label>Проемы:</label>${checkGroup('door2', ['Прямоугольные', 'Арочные', 'Портал'])}</div>
            <div class="form-group"><label>Перегородки (ширмы, стеллажи, стеклянные двери):</label><div class="input-box" contenteditable="true" data-placeholder="Введите текст..."></div></div>
            </section>`;
        } 
        else if (section.type === 'text') {
            html += `<section class="section"><h2 class="section-title">${section.title}</h2>`;
            section.questions.forEach(q => {
                html += `<div class="form-group"><label>${q.text}</label><div class="input-box" contenteditable="true" data-placeholder="Введите текст..."></div></div>`;
            });
            
            if (section.hasRefs) {
                html += `<div class="form-group"><label>Референсы (нажмите на рамку, чтобы загрузить фото):</label><div class="ref-grid">
                    <div class="ref-box" onclick="this.querySelector('input').click()"><span>Фото 1</span><input type="file" accept="image/*" onchange="loadImage(event, this.parentElement)"><img src=""><button class="delete-ref no-print" onclick="deleteImage(event, this.parentElement)">✕</button></div>
                    <div class="ref-box" onclick="this.querySelector('input').click()"><span>Фото 2</span><input type="file" accept="image/*" onchange="loadImage(event, this.parentElement)"><img src=""><button class="delete-ref no-print" onclick="deleteImage(event, this.parentElement)">✕</button></div>
                    <div class="ref-box" onclick="this.querySelector('input').click()"><span>Фото 3</span><input type="file" accept="image/*" onchange="loadImage(event, this.parentElement)"><img src=""><button class="delete-ref no-print" onclick="deleteImage(event, this.parentElement)">✕</button></div>
                </div></div>`;
            }
            html += `</section>`;
        } 
        else if (section.type === 'rooms') {
            html += `<section class="section"><h2 class="section-title">${section.title}</h2><p style="font-size:14px;margin-bottom:15px;">${section.desc}</p><div id="rooms-list">`;
            const roomList = [
                {id:'hallway', name:'Прихожая'}, {id:'kitchen', name:'Кухня'}, {id:'living_room', name:'Гостиная'}, 
                {id:'bedroom', name:'Спальня (мастер)'}, {id:'kids_room', name:'Детская', age:true}, 
                {id:'cabinet', name:'Кабинет'}, {id:'wardrobe', name:'Гардеробная'}, 
                {id:'bathroom_guest', name:'Санузел (гостевой)'}, {id:'bathroom_master', name:'Санузел (мастер)'}, 
                {id:'laundry', name:'Постирочная'}, {id:'balcony', name:'Балкон / Лоджия'}, {id:'terrace', name:'Терраса / Веранда'}
            ];
            roomList.forEach(r => {
                html += `<div class="room-row"><label class="custom-checkbox"><input type="checkbox" onchange="toggleRoom('${r.id}', this.checked)"><span class="checkmark"></span> ${r.name}</label><div class="input-box" contenteditable="true" data-placeholder="кол-во"></div>${r.age ? '<div class="input-box" contenteditable="true" style="width:150px;" data-placeholder="возраст"></div>' : ''}</div>`;
            });
            html += `<div id="custom-rooms"></div></div></section>`;
        }
        else if (section.type === 'details') {
            html += `<section class="section" id="details-section" style="display:none;"><h2 class="section-title">${section.title}</h2><div id="room-details-container"></div></section>`;
        }
    });
    container.innerHTML = html;
}

// Загрузка фото
function loadImage(event, box) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = box.querySelector('img');
            img.src = e.target.result;
            img.style.display = 'block';
            box.querySelector('span').style.display = 'none';
            box.querySelector('.delete-ref').style.display = 'flex';
        };
        reader.readAsDataURL(file);
    }
}
function deleteImage(event, box) {
    event.stopPropagation();
    box.querySelector('input').value = '';
    box.querySelector('img').src = '';
    box.querySelector('img').style.display = 'none';
    box.querySelector('span').style.display = 'block';
    box.querySelector('.delete-ref').style.display = 'none';
}

// Комнаты
function toggleRoom(roomId, isChecked) {
    const detailsContainer = document.getElementById('room-details-container');
    const existingRoom = document.getElementById('room-' + roomId);
    if (isChecked && !existingRoom && roomsData[roomId]) {
        const room = roomsData[roomId];
        const div = document.createElement('div');
        div.id = 'room-' + roomId;
        div.className = 'room-details';
        let qHtml = '';
        room.questions.forEach(q => {
            qHtml += `<div class="form-group"><label>${q}</label><div class="input-box" contenteditable="true" data-placeholder="Введите текст..."></div></div>`;
        });
        div.innerHTML = `<h4>${room.title}</h4>${qHtml}`;
        detailsContainer.appendChild(div);
    } else if (!isChecked && existingRoom) {
        existingRoom.remove();
    }
    document.getElementById('details-section').style.display = detailsContainer.children.length > 0 ? 'block' : 'none';
}

// PDF
function downloadPDF() {
    document.querySelectorAll('.input-box:empty').forEach(el => el.innerText = '');
    document.querySelectorAll('.ref-box img').forEach(img => { if(img.src) img.style.display = 'block'; });
    const element = document.getElementById('questionnaire');
    const opt = { margin: 0, filename: 'Анкета.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, scrollY: 0, allowTaint: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'] } };
    html2pdf().set(opt).from(element).save();
}

// Админка
function showPasswordModal() { document.getElementById('password-modal').style.display = 'flex'; }
function closePasswordModal() { document.getElementById('password-modal').style.display = 'none'; document.getElementById('admin-password').value = ''; }
function checkPassword() {
    if (document.getElementById('admin-password').value === "l0v3KSS") {
        closePasswordModal(); renderAdmin(); document.getElementById('admin-panel').style.display = 'flex';
    } else { alert('Неверный пароль!'); }
}
function renderAdmin() {
    const container = document.getElementById('admin-sections');
    let html = '';
    appData.forEach((section, sIdx) => {
        if (section.questions) {
            html += `<div class="admin-section"><div class="admin-section-header"><input type="text" value="${section.title}" onchange="appData[${sIdx}].title=this.value" style="width:100%;font-weight:bold;border:none;font-size:16px;"></div>`;
            section.questions.forEach((q, qIdx) => {
                html += `<div class="admin-q"><input type="text" value="${q.text}" onchange="appData[${sIdx}].questions[${qIdx}].text=this.value"><button onclick="appData[${sIdx}].questions.splice(${qIdx},1);renderAdmin();">✕</button></div>`;
            });
            html += `<button class="admin-add-btn" onclick="appData[${sIdx}].questions.push({text:'Новый вопрос'});renderAdmin();">+ Вопрос</button></div>`;
        }
    });
    container.innerHTML = html;
}
function saveAdmin() { localStorage.setItem('qData', JSON.stringify(appData)); renderForm(); document.getElementById('admin-panel').style.display = 'none'; alert('Сохранено!'); }
function exportHTML() { const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html'; a.click(); }

document.addEventListener('DOMContentLoaded', renderForm);
</script>
