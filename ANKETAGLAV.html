<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Анкета</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#dcd3c6;display:flex;flex-direction:column;align-items:center;padding:40px 20px;font-family:'Cormorant Garamond',serif;color:#1a1a1a}
.controls{margin-bottom:25px;display:flex;gap:15px;justify-content:center;width:100%;max-width:210mm}
button{padding:14px 28px;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;letter-spacing:1px;cursor:pointer;border:1px solid #1a1a1a;background:transparent;transition:.3s;text-transform:uppercase}
.btn-primary{background:#1a1a1a;color:#f4efe9}.btn-primary:hover{background:#333}
.btn-settings{padding:10px;border-radius:50%;position:fixed;bottom:20px;right:20px;z-index:100;background:#f4efe9;box-shadow:0 4px 10px rgba(0,0,0,.1);border:1px solid #1a1a1a}.btn-settings svg{width:24px;height:24px}
#password-modal,#admin-panel{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:center;padding:20px}
.password-box{background:#f4efe9;padding:30px;border-radius:8px;max-width:400px;width:100%;text-align:center;font-family:sans-serif}
.password-box input{width:100%;padding:10px;margin:15px 0;font-size:18px;text-align:center;border:1px solid #1a1a1a;background:transparent;font-family:monospace}
.password-box button{padding:10px 20px;font-family:sans-serif;font-size:14px;cursor:pointer}
.admin-content{background:#f4efe9;padding:30px;border-radius:8px;max-width:900px;width:100%;max-height:95vh;overflow-y:auto;font-family:sans-serif;color:#333}
.admin-content h3{margin-bottom:15px;font-family:'Playfair Display',serif;font-size:24px}.admin-content p{font-size:13px;margin-bottom:20px;color:#666}
.admin-section{background:#fff;border:1px solid #ddd;padding:15px;border-radius:6px;margin-bottom:15px}
.admin-section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:10px}
.admin-section-header input{font-size:16px;font-weight:bold;border:none;background:transparent;width:80%;outline:none}
.admin-question{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;padding:10px;background:#fafafa;border-radius:4px;border:1px solid #eee}
.admin-question input[type="text"]{flex:1;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px}
.admin-question select{padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px;background:#fff}
.admin-question button{padding:5px 10px;color:#d9534f;background:#fff;border:1px solid #d9534f;border-radius:4px;cursor:pointer;font-weight:bold}
.admin-add-btn{display:inline-block;padding:10px 15px;background:#e0e0e0;border:none;border-radius:4px;cursor:pointer;font-size:14px;margin-top:5px}
.admin-actions{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:0;background:#f4efe9;padding:15px 0;border-top:1px solid #ddd}
.admin-actions button{padding:12px 20px;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-size:14px}
.save-btn{background:#1a1a1a;color:#fff}.export-btn{background:#2c6e49;color:#fff}.close-btn{background:#ccc}.reset-btn{background:#ffcccc;margin-left:auto}
.a4-page{background:#f4efe9;width:210mm;padding:20mm 18mm;box-shadow:0 10px 30px rgba(0,0,0,.15);position:relative}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}
.logo h1{font-family:'Playfair Display',serif;font-size:42px;line-height:.85;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.house-icon{width:50px;height:50px}
.section{margin-bottom:25px}.section-title{font-family:'Playfair Display',serif;font-size:15px;letter-spacing:2px;margin-bottom:15px;text-transform:uppercase;border-bottom:1px solid #1a1a1a;padding-bottom:5px;display:inline-block}
.form-group{margin-bottom:15px;page-break-inside:avoid}
label{display:block;font-size:11px;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;font-weight:600;color:#333}
.underline-input{width:100%;border:none;border-bottom:1px solid #1a1a1a;background:transparent;font-family:'Cormorant Garamond',serif;font-size:18px;padding:3px 0;outline:none;color:#000}
.box-input{width:100%;border:1px solid #1a1a1a;background:transparent;font-family:'Cormorant Garamond',serif;font-size:16px;padding:8px;outline:none;resize:vertical;color:#000}
.checkbox-group{display:flex;gap:15px;flex-wrap:wrap;margin-top:5px}
.custom-checkbox{display:flex;align-items:center;cursor:pointer;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:#000}
.custom-checkbox input{display:none}
.checkmark{width:14px;height:14px;border:1px solid #1a1a1a;display:inline-block;margin-right:6px;position:relative;background:transparent}
.custom-checkbox input:checked+.checkmark::after{content:"✓";position:absolute;top:-5px;left:1px;font-size:16px;color:#1a1a1a}
.footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px;padding-top:15px;border-top:1px solid #1a1a1a}
.footer-left p{font-size:10px;letter-spacing:1px;color:#555;text-transform:uppercase}
.footer-right h2{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;text-transform:uppercase;letter-spacing:1px}
@media(max-width:768px){.a4-page{width:100%;padding:20px}.logo h1{font-size:32px}.house-icon{width:40px;height:40px}}
@media print{.no-print{display:none!important}body{background:#fff;padding:0;display:block}.a4-page{box-shadow:none;width:100%;padding:15mm;margin:0}}
</style>
</head>
<body>
<div class="controls no-print"><button onclick="downloadPDF()" class="btn-primary">Скачать PDF</button></div>
<button class="btn-settings no-print" onclick="showPasswordModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
<div id="password-modal"><div class="password-box"><h3>Вход в админ-панель</h3><input type="password" id="admin-password" placeholder="Пароль..."><div><button onclick="checkPassword()" style="background:#1a1a1a;color:#fff;border:none">Войти</button><button onclick="closePasswordModal()" style="background:#ccc;border:none;margin-left:10px">Отмена</button></div></div></div>
<div class="a4-page" id="questionnaire">
<header class="header"><div class="logo"><h1>HOME</h1><h1>DESIGN</h1><h1>FORM</h1></div><svg class="house-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 50 L50 15 L90 50" stroke-width="4"/><path d="M20 45 L20 90 L80 90 L80 45"/><rect x="40" y="60" width="20" height="30"/></svg></header>
<div id="form-content"></div>
<footer class="footer"><div class="footer-left"><p>АРХИТЕКТУРА И ИНТЕРЬЕР</p></div><div class="footer-right"><h2>THANK YOU</h2></div></footer>
</div>
<div id="admin-panel"><div class="admin-content">
<h3>Редактор анкеты</h3><p>Меняй текст, удаляй или добавляй вопросы. Потом нажми "Применить".</p>
<div id="admin-sections"></div>
<button class="admin-add-btn" onclick="addSection()">+ Добавить раздел</button>
<div class="admin-actions">
<button class="save-btn" onclick="saveAdmin()">Применить</button>
<button class="export-btn" onclick="exportHTML()">Скачать HTML</button>
<button class="close-btn" onclick="closeAdmin()">Закрыть</button>
<button class="reset-btn" onclick="resetAdmin()">Сброс</button>
</div>
</div></div>

<script>
const defaultConfig = [
{sectionTitle:"ЧАСТЬ 1. О ВАС И ВАШЕЙ СЕМЬЕ",questions:[
{type:"textarea",label:"СОСТАВ СЕМЬИ (взрослые, дети и их возраст)",name:"family_comp"},
{type:"textarea",label:"ДОМАШНИЕ ЖИВОТНЫЕ",name:"pets"},
{type:"textarea",label:"ПЛАНЫ НА БУДУЩЕЕ: изменения в составе семьи?",name:"future_plans"},
{type:"text",label:"РОД ДЕЯТЕЛЬНОСТИ / ХОББИ",name:"hobbies"},
{type:"textarea",label:"ОБРАЗ ЖИЗНИ (Член семьи 1: Имя)",name:"lifestyle_1"},
{type:"textarea",label:"ОБРАЗ ЖИЗНИ (Член семьи 2: Имя)",name:"lifestyle_2"}]},
{sectionTitle:"ЧАСТЬ 2. ОТДЕЛКА, СВЕТ И ОКНА",questions:[
{type:"checkbox",label:"Стены:",name:"walls",options:["Обои","Штукатурка","Покраска","Панели","Кирпич"]},
{type:"text",label:"Акцентные стены?",name:"accent_walls"},
{type:"checkbox",label:"Потолки:",name:"ceilings",options:["Натяжной","Гипсокартон","Штукатурка","Реечный"]},
{type:"checkbox",label:"Полы:",name:"floors",options:["Паркет","Инженерная доска","Ламинат","Керамогранит"]},
{type:"text",label:"Цвет пола",name:"floor_color"},
{type:"checkbox",label:"Панорамные окна:",name:"panoramic_windows",options:["Есть","Нет"]},
{type:"checkbox",label:"Шторы:",name:"window_systems",options:["Текстиль","Римские","Рулонные","Жалюзи"]},
{type:"checkbox",label:"Скрытые карнизы?",name:"hidden_cornices",options:["Да","Нет"]},
{type:"checkbox",label:"Двери:",name:"doors",options:["Скрытые","Классические","Минимализм"]},
{type:"checkbox",label:"Проемы:",name:"openings",options:["Прямоугольные","Арочные","Портал"]},
{type:"text",label:"Перегородки?",name:"partitions"},
{type:"checkbox",label:"Основной свет:",name:"main_light",options:["Люстра","Подвесные","Без основного"]},
{type:"checkbox",label:"Доп. свет:",name:"extra_light",options:["Споты","Трековые","Ленты"]},
{type:"checkbox",label:"Диммеры?",name:"dimmers",options:["Да","Нет"]}]},
{sectionTitle:"ЧАСТЬ 3. ПРИХОЖАЯ И КУХНЯ",questions:[
{type:"textarea",label:"ПРИХОЖАЯ: «Я захожу с сумкой...»",name:"hallway_scenario"},
{type:"checkbox",label:"Хранение:",name:"hallway_storage",options:["Шкаф","Вешалка"]},
{type:"checkbox",label:"Обувь:",name:"shoes",options:["Обувница","Гардеробная"]},
{type:"checkbox",label:"Сушка для обуви?",name:"shoe_dryer",options:["Да","Нет"]},
{type:"checkbox",label:"Скамья/пуф?",name:"bench",options:["Да","Нет"]},
{type:"text",label:"Где ключи и зонты?",name:"small_things"},
{type:"checkbox",label:"Зеркало в полный рост?",name:"mirror",options:["Да","Нет"]},
{type:"textarea",label:"КУХНЯ: «Я захожу первым делом...»",name:"kitchen_scenario"},
{type:"checkbox",label:"Планировка:",name:"kitchen_layout",options:["Линейная","Угловая","П-образная","Остров"]},
{type:"checkbox",label:"Верхние шкафы:",name:"upper_cabinets",options:["Оставляем","Убираем"]},
{type:"checkbox",label:"Техника:",name:"appliances",options:["Духовка","СВЧ","Посудомойка","Винный шкаф"]},
{type:"checkbox",label:"Сушка для посуды:",name:"dish_dryer",options:["Над мойкой","Внизу","Скрытая","Нет"]},
{type:"checkbox",label:"Потайной ящик?",name:"safe",options:["Да","Нет"]},
{type:"checkbox",label:"Пенал для противней?",name:"baking_tray",options:["Да","Нет"]},
{type:"checkbox",label:"Посуда:",name:"dishes",options:["Витрина","В шкафы"]},
{type:"text",label:"Фартук и столешница",name:"apron"}]},
{sectionTitle:"ЧАСТЬ 4. ГОСТИНАЯ, СПАЛЬНЯ, САНУЗЕЛ",questions:[
{type:"text",label:"ГОСТИНАЯ: Сколько посадочных мест?",name:"seats"},
{type:"text",label:"ТВ или проектор?",name:"tv"},
{type:"text",label:"Стол (какой, на сколько человек)?",name:"table"},
{type:"text",label:"Открытые полки для книг?",name:"shelves"},
{type:"text",label:"СПАЛЬНЯ: Размер кровати",name:"bed_size"},
{type:"checkbox",label:"Тумбы с обеих сторон?",name:"nightstands",options:["Да","Нет"]},
{type:"checkbox",label:"Кресло для чтения?",name:"reading_chair",options:["Да","Нет"]},
{type:"checkbox",label:"ТВ в спальне?",name:"bedroom_tv",options:["Да","Нет"]},
{type:"checkbox",label:"Макияж:",name:"makeup",options:["В спальне","В ванной"]},
{type:"checkbox",label:"Хранение одежды:",name:"clothes_storage",options:["Гардеробная","Шкаф"]},
{type:"text",label:"ГАРДЕРОБНАЯ: Чего больше?",name:"wardrobe_clothes"},
{type:"checkbox",label:"Полки для аксессуаров?",name:"accessories",options:["Да","Нет"]},
{type:"text",label:"Где зимние вещи?",name:"winter_clothes"},
{type:"checkbox",label:"Розетка для утюга?",name:"ironing",options:["Да","Нет"]},
{type:"checkbox",label:"Система:",name:"wardrobe_system",options:["Закрытая","Открытая"]},
{type:"checkbox",label:"САНУЗЕЛ: Ванна или душ?",name:"bath_shower",options:["Ванна","Душевая","Тропический душ"]},
{type:"checkbox",label:"Постирочная:",name:"laundry",options:["Стиральная","Сушильная"]},
{type:"checkbox",label:"Корзина для белья:",name:"laundry_basket",options:["Открытая","В шкафу"]},
{type:"checkbox",label:"Хранение баночек:",name:"cosmetics",options:["Ниши","Пеналы","Ящики"]},
{type:"checkbox",label:"Столешница и зеркало с подсветкой?",name:"makeup_bath",options:["Да","Нет"]},
{type:"text",label:"Где полотенца и химия?",name:"bath_storage"}]},
{sectionTitle:"ЧАСТЬ 5. КАБИНЕТ, ДЕТСКАЯ, СТИЛЬ",questions:[
{type:"text",label:"КАБИНЕТ: Чем занимаетесь?",name:"cabinet_activity"},
{type:"checkbox",label:"Оборудование:",name:"equipment",options:["Монитор","Ноутбук","Принтер","Планшет"]},
{type:"textarea",label:"ДЕТСКАЯ: Возраст, увлечения, зона учебы?",name:"kids_room"},
{type:"text",label:"СТИЛЬ: 3 прилагательных для дома",name:"associations"},
{type:"checkbox",label:"Атмосфера:",name:"atmosphere",options:["Спа","Энергичная","Строгая","Творческая"]},
{type:"text",label:"Акцентный цвет?",name:"accent_color"},
{type:"text",label:"Цвета-табу",name:"taboo_colors"},
{type:"text",label:"Материалы-табу",name:"taboo_materials"},
{type:"text",label:"Гостиная (стиль)",name:"style_living"},
{type:"text",label:"Спальня (стиль)",name:"style_bedroom"},
{type:"text",label:"Кабинет (стиль)",name:"style_cabinet"}]}
];

let currentConfig = JSON.parse(localStorage.getItem('questionnaireConfig')) || defaultConfig;

function renderForm(){
const container=document.getElementById('form-content');let html='';
currentConfig.forEach(section=>{
html+=`<section class="section"><h2 class="section-title">${section.sectionTitle}</h2>`;
section.questions.forEach(q=>{
if(q.type==='textarea'){html+=`<div class="form-group"><label>${q.label}</label><textarea name="${q.name}" rows="2" class="box-input"></textarea></div>`;}
else if(q.type==='checkbox'){html+=`<div class="form-group"><label>${q.label}</label><div class="checkbox-group">`;q.options.forEach(opt=>{html+=`<label class="custom-checkbox"><input type="checkbox" name="${q.name}" value="${opt}"><span class="checkmark"></span> ${opt}</label>`;});html+=`</div></div>`;}
else{html+=`<div class="form-group"><label>${q.label}</label><input type="text" name="${q.name}" class="underline-input"></div>`;}
});html+=`</section>`;});
container.innerHTML=html;
}
document.addEventListener('DOMContentLoaded',renderForm);

function downloadPDF(){
const element=document.getElementById('questionnaire');
const opt={margin:0,filename:'Анкета.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}};
setTimeout(()=>{html2pdf().set(opt).from(element).save();},300);
}

function showPasswordModal(){document.getElementById('password-modal').style.display='flex';}
function closePasswordModal(){document.getElementById('password-modal').style.display='none';document.getElementById('admin-password').value='';}
function checkPassword(){
if(document.getElementById('admin-password').value==="l0v3KSS"){closePasswordModal();renderAdmin();document.getElementById('admin-panel').style.display='flex';}
else{alert('Неверный пароль!');}
}
function closeAdmin(){document.getElementById('admin-panel').style.display='none';}

function renderAdmin(){
const container=document.getElementById('admin-sections');let html='';
currentConfig.forEach((section,sIndex)=>{
html+=`<div class="admin-section"><div class="admin-section-header"><input type="text" value="${section.sectionTitle}" onchange="updateSectionTitle(${sIndex},this.value)"><button onclick="deleteSection(${sIndex})" style="color:#d9534f;background:none;border:none;cursor:pointer">Удалить</button></div>`;
section.questions.forEach((q,qIndex)=>{
html+=`<div class="admin-question"><select onchange="updateQuestionType(${sIndex},${qIndex},this.value)"><option value="text" ${q.type==='text'?'selected':''}>Строка</option><option value="textarea" ${q.type==='textarea'?'selected':''}>Абзац</option><option value="checkbox" ${q.type==='checkbox'?'selected':''}>Галочки</option></select><input type="text" value="${q.label}" onchange="updateQuestionLabel(${sIndex},${qIndex},this.value)"><button onclick="deleteQuestion(${sIndex},${qIndex})">✕</button></div>`;
});html+=`<button class="admin-add-btn" onclick="addQuestion(${sIndex})">+ Вопрос</button></div>`;});
container.innerHTML=html;
}

function updateSectionTitle(sIndex,val){currentConfig[sIndex].sectionTitle=val;}
function updateQuestionLabel(sIndex,qIndex,val){currentConfig[sIndex].questions[qIndex].label=val;}
function updateQuestionType(sIndex,qIndex,val){
const q=currentConfig[sIndex].questions[qIndex];q.type=val;
if(val==='checkbox'&&!q.options){q.options=["Вариант 1","Вариант 2"];}
}
function deleteSection(sIndex){if(confirm('Удалить раздел?')){currentConfig.splice(sIndex,1);renderAdmin();}}
function deleteQuestion(sIndex,qIndex){currentConfig[sIndex].questions.splice(qIndex,1);renderAdmin();}
function addSection(){currentConfig.push({sectionTitle:"НОВЫЙ РАЗДЕЛ",questions:[]});renderAdmin();}
function addQuestion(sIndex){currentConfig[sIndex].questions.push({type:"text",label:"НОВЫЙ ВОПРОС",name:"q_"+Date.now()});renderAdmin();}

function saveAdmin(){
localStorage.setItem('questionnaireConfig',JSON.stringify(currentConfig));
renderForm();alert('Применено! Теперь нажми "Скачать HTML", чтобы обновить файл сайта.');
}
function resetAdmin(){if(confirm('Сбросить все?')){localStorage.removeItem('questionnaireConfig');currentConfig=JSON.parse(JSON.stringify(defaultConfig));renderAdmin();renderForm();}}
function exportHTML(){
let htmlContent=document.documentElement.outerHTML;
const newConfigString=JSON.stringify(currentConfig,null,4);
const regex=/const defaultConfig = \[[\s\S]*?\];/;
const updatedHTML=htmlContent.replace(regex,`const defaultConfig = ${newConfigString};`);
const blob=new Blob([updatedHTML],{type:'text/html'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download='index.html';
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
</script>
</body>
</html>
